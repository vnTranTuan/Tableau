<html>
<head>
    <title>WDC Orders</title>
    <script src="https://connectors.tableau.com/libs/tableauwdc-2.3.latest.js" type="text/javascript"></script>
    <script>
        (function () {
            var myConnector = tableau.makeConnector();
            myConnector.getSchema = function (schemaCallback) {
                var cols = [
                    { id: "ID", dataType: tableau.dataTypeEnum.int },
                    { id: "ma_don_hang", dataType: tableau.dataTypeEnum.string },
                    { id: "so_luong", dataType: tableau.dataTypeEnum.int },
                    { id: "ma_san_pham", dataType: tableau.dataTypeEnum.string },
                    { id: "khuyen_mai", dataType: tableau.dataTypeEnum.float }
                ];
                var tableSchema = { id: "tbl_DON_HANG", alias: "Đơn hàng", columns: cols };
                schemaCallback([tableSchema]);
            };
            myConnector.getData = function (table, doneCallback) {
                fetch('http://localhost:5000/api/V2/donhang')
                    .then(response => response.json())
                    .then(data => {
                        table.appendRows(data);
                        doneCallback();
                    });
            };
            tableau.registerConnector(myConnector);
        })();
    </script>
</head>
<body style="font-family: Arial; text-align: center; padding-top: 50px;">
    <h2>Kết nối SQL Server với Tableau Public</h2>
    <h2>Table đơn hàng: tbl_DON_HANG</h2>

    <button onclick="tableau.submit()" style="padding:10px; background:#e67e22; color:white; border:none; border-radius:5px; cursor:pointer;">
        Get Data: "Đơn hàng"
    </button>
</body>
</html>
